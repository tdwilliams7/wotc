server {
  listen 80;
  root /usr/share/nginx/html;

  location /graphql {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
  }

  # Only the .ics download goes to the API; /events/:id is a frontend route
  location ~ ^/events/[^/]+/invite\.ics$ {
    proxy_pass http://backend:4000;
  }

  location / {
    try_files $uri /index.html;
  }
}