services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
      POSTGRES_DB: events
    # Host port 5433 avoids clashing with a locally installed Postgres
    ports: ["5433:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      # Inside the compose network the DB is "db" on its internal port 5432
      DATABASE_URL: postgres://events:events@db:5432/events
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-http://localhost:5173}
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  dbdata: